<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ComunaClic</title>
    <base href="/" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3d6a00",
                        "primary-dim": "#2d5000",
                        "primary-container": "#a7f255",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#1a2e0b",
                        "secondary": "#3d6a03",
                        "background": "#f9faf7",
                        "background-light": "#f9faf7",
                        "background-dark": "#10221c",
                        "surface": "#f9faf7",
                        "on-surface": "#191c1b",
                        "outline": "#727a65",
                        "outline-variant": "#c1cab2"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-size: 24px; }

        /* Layout flex column para MAUI: evita position:fixed que falla en Android WebView */
        html, body {
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0; padding: 0;
        }
        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="ComunaClick.Mobile.styles.css" rel="stylesheet" />
</head>

<body class="bg-background-light dark:bg-background-dark text-[#111816] dark:text-white min-h-screen">

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/ComunaClick.SharedUI/lib/signalr/signalr.min.js"></script>
    <script src="_content/ComunaClick.SharedUI/app.js"></script>
    <script src="_content/ComunaClick.SharedUI/delivery-tracking.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
